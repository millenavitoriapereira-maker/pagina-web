<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog da Millena</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        
    
        header {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
            background-color: #D8B5E7;
            color: #1C2835;
            text-align: center;
        }
        
        
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
            background-color: #1C2835;
            color: #D8B5E7;
            text-align: center;
        }
        
        
        img {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            border-radius: 12px;
        }
        
        h2 {
            margin-top: 16px;
            margin-bottom: 8px;
        }
        
        
        main p {
            max-width: 600px;
            margin: 8px auto;
            text-align: left;
            line-height: 1.6;
        }
        
        .autor {
            margin-bottom: 16px !important;
            padding-bottom: 12px;
            border-bottom: 1px solid #D8B5E7;
            font-size: 0.9em;
            font-style: italic;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre a medicina veterinária</p>
    </header>
    
    <main>
        <img src="imagem-blog.png" alt="Ícone quadrado com bordas arredondadas em tons de lilás claro e roxo, apresentando uma ilustração central de um coração anatômico entrelaçado pelo Bastão de Esculápio (símbolo da medicina). O coração está posicionado no centro de uma rosa dos ventos. Ao redor, há pequenos ícones que representam a ciência e a veterinária: uma pata de animal com uma lua, uma árvore, um livro aberto, um tubo de ensaio e um microscópio. O fundo é lilás bem claro com uma textura sutil de papel.">
        
        <h2>Meu primeiro post</h2>
        <p class="autor">Por: Millena</p>
        <p>Boas-vindas ao meu blog! Aqui vou compartilhar informações sobre a medicina veterinária e suas curiosidades.</p>
    </main>

</body>
</html>
